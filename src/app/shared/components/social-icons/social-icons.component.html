<ul class="app-socials" role="list">
  @for (link of links(); track link.id) {
    <li>
      <a
        class="app-socials__link"
        [href]="link.url"
        [attr.aria-label]="link.label"
        [attr.target]="link.icon === 'email' ? null : '_blank'"
        [attr.rel]="link.icon === 'email' ? null : 'noopener noreferrer'"
      >
        @switch (link.icon) {
          @case ('github') {
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 2C6.477 2 2 6.486 2 12.021c0 4.425 2.865 8.18 6.839 9.504.5.093.682-.217.682-.483 0-.237-.009-.866-.013-1.7-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.621.069-.608.069-.608 1.004.071 1.532 1.032 1.532 1.032.892 1.53 2.341 1.088 2.91.833.091-.647.35-1.088.636-1.339-2.221-.253-4.555-1.113-4.555-4.952 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.026 2.747-1.026.546 1.378.203 2.397.1 2.65.64.7 1.028 1.595 1.028 2.688 0 3.848-2.338 4.695-4.566 4.944.359.31.678.92.678 1.855 0 1.338-.012 2.419-.012 2.749 0 .268.18.58.688.481A10.02 10.02 0 0 0 22 12.021C22 6.486 17.523 2 12 2Z"
              />
            </svg>
          }
          @case ('linkedin') {
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M19 3A2 2 0 0 1 21 5v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14Zm-9.5 15.5v-7H7v7h2.5ZM8.25 10.1a1.45 1.45 0 1 0 0-2.9 1.45 1.45 0 0 0 0 2.9ZM18 18.5v-3.85c0-2.06-1.1-3.02-2.57-3.02-1.18 0-1.71.65-2.01 1.11v-0.95H11v7h2.5v-3.9c0-1.03.2-2.02 1.47-2.02 1.25 0 1.28 1.17 1.28 2.08v3.84H18Z"
              />
            </svg>
          }
          @case ('email') {
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4.2-8 5.05L4 8.2V6l8 5.05L20 6v2.2Z"
              />
            </svg>
          }
          @default {
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2Zm1 15h-2v-2h2Zm0-4h-2V7h2Z"
              />
            </svg>
          }
        }
      </a>
    </li>
  }
</ul>
